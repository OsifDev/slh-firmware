name: Build Firmware

on:
  push:
    branches: [main]
    paths-ignore:
      - 'firmware/**'

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip-build]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Write secrets.h
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASS: ${{ secrets.WIFI_PASS }}
        run: |
          printf '#define WIFI_SSID  "%s"\n' "$WIFI_SSID"  > src/secrets.h
          printf '#define WIFI_PASS  "%s"\n' "$WIFI_PASS" >> src/secrets.h
          printf '#define OWNER_NAME "OSIF"\n'            >> src/secrets.h
          cat src/secrets.h

      - name: Build
        run: pio run -e esp32-2432s028

      - name: Stage firmware
        run: |
          mkdir -p firmware
          cp .pio/build/esp32-2432s028/firmware.bin firmware/firmware.bin

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add firmware/firmware.bin
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "build: firmware.bin [skip-build]"
            git push
          fi
